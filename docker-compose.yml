# Render tiles and look at them with docker compose. Fetch the submodules
# first (git submodule update --init --recursive); see docs/INSTALL.md.
#
#   docker compose build
#
# Render an area from a file in ./data:
#   docker compose run --rm tilemaker --input /data/area.osm --output /data/area.mbtiles
#
# Or from a pycrocosm map database (see "Map database" below):
#   docker compose run --rm tilemaker --db --bbox -1.095,50.795,-1.085,50.8 --output /data/area.mbtiles
#
# Then look at the map at http://localhost:8081/ (TILEMAKER_PORT to change it):
#   docker compose up server
#
# The server renders each tile from the map database as the map asks for it,
# running tilemaker in the same container (z11 and up; TILEMAKER_BBOX is where
# the map opens). To serve tiles rendered earlier instead, from ./data:
#   docker compose run --rm --service-ports server --input /data/area.mbtiles --static /usr/src/app/static --port 8081
#
# The image's own config.json and process.lua are used unless you pass
# --config and --process, such as files in ./data.
#
# Map database: --db with no connection string uses the PG* variables below,
# taken from your shell or a .env file beside this one. host.docker.internal is
# the machine running Docker; PostgreSQL there must listen on, and allow
# connections from, the Docker network. Keep the password in PGPASSWORD.

x-database: &database
  environment:
    PGHOST: ${PGHOST:-host.docker.internal}
    PGPORT: ${PGPORT:-5432}
    PGDATABASE: ${PGDATABASE:-}
    PGUSER: ${PGUSER:-}
    PGPASSWORD: ${PGPASSWORD:-}
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-image: &image
  image: tilemaker-core
  build:
    context: .
    args:
      # Compiles at once; each can take a GB or more of memory
      BUILD_JOBS: ${BUILD_JOBS:-4}

services:
  tilemaker:
    <<: [*image, *database]
    profiles: ["render"]   # run with docker compose run, not started by up
    # Files written to ./data belong to you (set HOST_UID and HOST_GID if you are not 1000)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./data:/data

  server:
    <<: [*image, *database]
    entrypoint: ["/usr/src/app/tilemaker-server"]
    command: ["--render", "--bbox", "${TILEMAKER_BBOX:--1.095,50.795,-1.085,50.8}",
              "--table-prefix", "${TABLE_PREFIX:-pycrocosm_mod_}",
              "--static", "/usr/src/app/static", "--port", "8081"]
    volumes:
      - ./data:/data:ro
    ports:
      - "${TILEMAKER_PORT:-8081}:8081"
