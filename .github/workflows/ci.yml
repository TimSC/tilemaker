name: "Continuous Integration"

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (CMake)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        # cppo5m, and its iso8601lib
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake liblua5.1-0-dev libsqlite3-dev libshp-dev \
          libboost-program-options-dev libboost-filesystem-dev libboost-system-dev \
          rapidjson-dev libexpat1-dev zlib1g-dev libprotobuf-dev protobuf-compiler libpq-dev

    - name: Build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel "$(nproc)"

    - name: Test
      run: ctest --test-dir build --output-on-failure
